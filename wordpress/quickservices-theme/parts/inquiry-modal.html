<!-- Quick Inquiry Modal Launcher -->
<div class="inquiry-modal-backdrop" id="inquiryModal" role="dialog" aria-modal="true" aria-labelledby="inquiryModalTitle" hidden>
    <div class="inquiry-modal-card">
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close dialog">&times;</button>
        <div class="modal-header">
            <span class="badge-accent">Direct Consultation</span>
            <h3 id="inquiryModalTitle" class="modal-title">Initiate Academic Inquiry</h3>
            <p class="modal-sub">Direct engagement with <strong>M. Yousaf</strong> (MS English, BZU). Expect a prompt review of your scope within 30 minutes.</p>
        </div>

        <form id="inquiryForm" class="inquiry-form" onsubmit="event.preventDefault(); window.launchWhatsAppInquiry();">
            <div class="form-group">
                <label for="studentName" class="form-label">Your Name &amp; University</label>
                <input type="text" id="studentName" class="form-input" placeholder="e.g. Ayesha Khan (QAU / BZU / NUST)" required>
            </div>

            <div class="form-group">
                <label for="academicDiscipline" class="form-label">Degree Level &amp; Field</label>
                <select id="academicDiscipline" class="form-select" required>
                    <option value="" disabled selected>Select Degree Program</option>
                    <option value="PhD Dissertation">PhD Candidate / Dissertation</option>
                    <option value="MPhil / MS Thesis">MPhil / MS Thesis</option>
                    <option value="BS Final Year Project">BS Capstone / Research Project</option>
                    <option value="Journal Publication">Academic Journal Manuscript</option>
                </select>
            </div>

            <div class="form-group">
                <label for="serviceRequired" class="form-label">Primary Academic Specialty Required</label>
                <select id="serviceRequired" class="form-select" required>
                    <option value="SPSS & SmartPLS Statistics Support">SPSS / SmartPLS Data Analysis &amp; Interpretation</option>
                    <option value="APA 7th Academic Editing & Proofreading">Academic Language Editing &amp; APA 7th Alignment</option>
                    <option value="Literature Review Synthesis">Literature Review &amp; Theoretical Framework Search</option>
                    <option value="Methodology & Questionnaire Design">Methodology &amp; Instrument Reliability Design</option>
                    <option value="Turnitin Similarity Remediation">Turnitin Similarity Review &amp; Ethical Defense</option>
                    <option value="MPhil/PhD Viva Defense Coaching">Viva Voce Defense Mock Presentation Coaching</option>
                </select>
            </div>

            <div class="form-group">
                <label for="briefNotes" class="form-label">Scope Details / Topic (Optional)</label>
                <textarea id="briefNotes" class="form-textarea" rows="3" placeholder="Brief description of your research topic, current chapter, or deadline..."></textarea>
            </div>

            <button type="submit" class="btn btn-whatsapp btn-block btn-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span>Launch Direct WhatsApp Session</span>
            </button>
            <p class="form-disclaimer">Zero spam. Encrypted WhatsApp communication directly with M. Yousaf.</p>
        </form>
    </div>
</div>
